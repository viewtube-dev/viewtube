<style>

.t-marker{--c:#FFA85C}.t-project{--c:var(--A)}.t-publish{--c:#F55EFC}.t-task{--c:#36E0F6}.t-deadline{--c:#FA618A}.t-milestone{--c:#FFDA47}.st-draft{--sc:#9AA0A6}.st-scheduled{--sc:var(--A)}.st-live{--sc:#3FEE56}.st-done{--sc:#4EE4BE}.pr-low{--c:#4EE4BE}.pr-med{--c:#FFA85C}.pr-high{--c:#FA618A}
.th{position:relative;display:block;flex:none;overflow:hidden;background:linear-gradient(160deg,var(--t1,#3f5a7a),var(--t2,#0e1524));background-size:cover;background-position:center}.th::before{content:"";position:absolute;right:18%;top:16%;width:22%;aspect-ratio:1;border-radius:50%;background:#ffffffd9}.th::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:#0000005c;clip-path:polygon(0 100%,0 62%,28% 28%,50% 60%,72% 18%,100% 66%,100% 100%)}.th.img::before,.th.img::after{display:none}

.seg{display:flex;border:3px solid #000;border-radius:8px;overflow:hidden;background:#fff}.seg button{flex:1;min-height:34px;padding:0 6px;border:0;border-right:3px solid #000;background:#fff;font:1000 10px Inter,sans-serif;text-transform:uppercase;transition:background .2s}.seg button:last-child{border-right:0}.seg button.on{background:var(--A)}

.wd{display:grid;grid-template-columns:repeat(7,1fr);background:var(--Al);border-bottom:3px solid #000}.wd span{text-align:center;padding:5px 0;font:1000 10px Inter,sans-serif;border-right:2px solid #000}.wd span:last-child{border-right:0}
.gr.sl{animation:sl .35s cubic-bezier(.3,1.2,.4,1)}.gr.sr{animation:sr .35s cubic-bezier(.3,1.2,.4,1)}@keyframes sl{from{transform:translateX(30px);opacity:.2}}@keyframes sr{from{transform:translateX(-30px);opacity:.2}}

.dy{position:relative;min-width:0;min-height:calc(90px + var(--l,0)*var(--lh));padding:calc(var(--t0) + var(--l,0)*var(--lh)) 3px 3px;border-right:2px solid #000;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:background .15s}.dy:nth-child(7n){border-right:0}.dy.out{background:#f1f1f1}.dy.out .n{opacity:.45}.dy.over{background:var(--Bl)}.dy.sel{background:color-mix(in srgb,var(--A) 14%,#fff);box-shadow:inset 0 0 0 3px var(--A)}
.dy .n{position:absolute;left:5px;top:3px;min-width:20px;height:20px;display:grid;place-items:center;font:1000 13px Inter,sans-serif}.dy.today .n{background:var(--B);border:2px solid #000;border-radius:50%}.dy .mks{position:absolute;right:4px;top:5px;display:flex;gap:2px}.dy .mks i{width:10px;height:10px;border:2px solid #000;border-radius:50%;background:var(--c)}

.more{height:16px;flex:none;padding:0 4px;border:2px dashed #000;border-radius:5px;background:#fff;font:1000 9px Inter,sans-serif;text-align:left}

/* panel */

.ph{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--B);border-bottom:3px solid #000;flex-wrap:wrap}.ph .dn{display:flex;align-items:center;gap:8px;flex:1;min-width:210px}.ph .dn b{font:1000 44px/1 Inter,sans-serif}.ph .dn span{display:block;font:1000 12px Inter,sans-serif}.ph .dn small{display:block;font:800 10px Inter,sans-serif;opacity:.7}.ph .sm{display:flex;gap:5px;flex-wrap:wrap}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;padding:10px;border-bottom:3px solid #000;background:var(--Al);animation:pp .25s}.qa .q{display:flex;align-items:center;gap:8px;padding:6px;border:3px solid #000;border-radius:8px;background:#fff;font:1000 10px Inter,sans-serif;text-align:left;text-transform:uppercase;transition:transform .12s}.qa .q:active{transform:scale(.94)}.qa .q i{display:grid;place-items:center;width:28px;height:28px;border:2px solid #000;border-radius:6px;background:var(--c);flex:none}.qa .q i svg{width:15px;height:15px}

.mk{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;border:3px solid #000;border-radius:8px;background:#fff}.mk i{width:16px;height:16px;border:2px solid #000;border-radius:50%;background:var(--c);flex:none}.mk b{flex:1;font:1000 11px Inter,sans-serif}
.nt{width:100%;min-height:92px;resize:vertical;padding:8px 10px;border:3px solid #000;border-radius:8px;background:var(--Al);box-shadow:inset 0 0 0 3px var(--A);font:600 12px Inter,sans-serif;outline:0}
/* modal */
.md{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:10px;background:#000a;animation:fd .2s}@keyframes fd{from{opacity:0}}.mp{width:min(100%,660px);max-height:94vh;overflow:auto;border:3px solid #000;border-radius:12px;background:#fff;box-shadow:6px 6px 0 var(--B);animation:pp .3s cubic-bezier(.3,1.5,.5,1)}.mh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--c);border-bottom:3px solid #000}.mh .ty{display:grid;place-items:center;width:34px;height:34px;border:2px solid #000;border-radius:7px;background:#fff}.mh .ty svg{width:17px;height:17px}.mh b{flex:1;font:1000 16px Inter,sans-serif}.mb{display:grid;gap:12px;padding:12px}.mb .g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.fr label{display:block;margin:0 0 5px;font:1000 10px Inter,sans-serif;letter-spacing:.06em}.fr .hint{margin:4px 0 0;font:600 10px Inter,sans-serif;opacity:.65}.mf{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--Al);border-top:3px solid #000}.mf .sp{flex:1}

.shake{animation:shk .4s}@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

 const btn=(label,variant='')=>`<button type="button" class="native-btn ${variant}"><span class="rail-icon">✦</span><span class="rail-text">${label}</span></button>`;
 const led=(mode,label,sub)=>`<div class="led-status" data-mode="${mode}"><span class="led-orb" aria-hidden="true"><svg viewBox="0 0 44 44">${ledDots}</svg><i class="led-center"></i></span><span><b>${label}</b><small style="display:block;opacity:.65;margin-top:3px">${sub}</small></span></div>`;
 const split=(portrait)=>`<div class="split-rail ${portrait?'portrait':''}"><div class="rail-media" aria-label="Thumbnail specimen"></div><div class="rail-copy"><div class="rail-title">${portrait?'VERTICAL SHORT · 9:16':'PROJECT THUMBNAIL · 16:9'}</div><div class="native-row" style="margin:0"><span class="native-pill">DUE FRI</span><span class="spectrum" style="--tag:#f55efc"><i></i>Publish</span></div><small style="opacity:.65">Split rail · media + event metadata</small></div></div>`;
 const content=`<div class="native-library" id="studio-native-library">
 <header><div><h2>Studio Controls · Calendar Primitive Library</h2><div style="font-size:11px;font-weight:800">Standalone specimen workbench · Calendar, Projects and development workflow</div></div><span class="native-pill">Prototype only</span></header>
 <div class="native-grid">
 ${section('Split action buttons','Split-button family reuses the established Studio split anatomy: full-height rail, one divider, centered label.',row(btn('Create project')+btn('Edit event','neutral')+btn('Delete','danger')+btn('Mark complete','success'))+`<div class="primitive-note">Production target: import canonical split-button exports. No calendar-only button tokens or geometry should be added.</div>`)}
 ${section('Square icon buttons','Compact actions for navigation, edit, duplicate, delete, upload and overflow.',row('<button class="native-square active" aria-label="Previous month">‹</button><button class="native-square" aria-label="Edit">✎</button><button class="native-square" aria-label="Duplicate">⧉</button><button class="native-square" aria-label="More actions">•••</button><button class="native-square" aria-label="Delete">×</button>')+row('<button class="native-square" aria-label="Previous" style="width:24px;height:24px;border-width:2px">‹</button><button class="native-square" aria-label="Next" style="width:24px;height:24px;border-width:2px">›</button>'))}
 ${section('Spectrum tags + closeable badges','Tag colors are semantic specimens. Removable tags use a distinct, accessible close target.',row(['PROJECT','PUBLISH','TASK','MILESTONE','DEADLINE'].map((t,i)=>`<span class="spectrum" style="--tag:${palette[i]}"><i></i>${t}</span>`).join(''))+row(['YOUTUBE','RESEARCH','REVIEW'].map((t,i)=>`<span class="close-tag" style="--tag:${palette[i+2]}">${t}<button type="button" aria-label="Remove ${t}" data-remove-tag>×</button></span>`).join(''))+`<div class="primitive-note">Use the existing Spectrum Tag and Closeable Badge production counterparts; do not create a second color-mapping system.</div>`)}
 ${section('Split thumbnail rails','Media + event badge composition in both required aspect ratios. The media region stays a true ratio; metadata owns the adjacent rail.',`<span class="native-label">Landscape · 16:9</span>${split(false)}<span class="native-label">Portrait · 9:16</span>${split(true)}`)}
 ${section('Event chips + task rows','Compact, scannable events for calendar cells, agenda lists and project detail.',row(`<div class="native-event" style="--event:#f55efc;flex:1"><i class="event-led"></i><span class="event-content"><b>Publish · Studio update</b><small>Today · 14:30 · Scheduled</small></span><span class="native-pill">LIVE</span></div>`)+row(`<div class="native-event" style="--event:#ffda47;flex:1"><i class="event-led"></i><span class="event-content"><b>Milestone · Review build</b><small>Project: Calendar integration</small></span><button class="native-square" style="width:27px;height:27px" aria-label="Open milestone">↗</button></div>`)+row(`<div class="native-event" style="--event:#3fee56;flex:1"><i class="event-led"></i><span class="event-content"><b>Task · Run regression suite</b><small>3 of 5 checklist items complete</small></span><button class="native-check" role="checkbox" aria-checked="false" aria-label="Complete regression task" data-check></button></div>`))}
 ${section('Brain status LED badges','64 individual LED lights, circular status indicator, and prism/radar/flare/steady/blink animation states. Honors reduced-motion preferences.',`<div style="display:grid;gap:8px">${led('prism','BRAIN · ACTIVE','Prism animation · evidence linked')}${led('radar','CHANNEL CONTEXT','Radar pulse · connected')}${led('flare','REVIEW REQUIRED','Flare animation · attention')}${led('steady','SAVED LOCALLY','Steady · persistence state')}${led('blink','BUILD RUNNING','Blink · task in progress')}</div>`)}
 ${section('Animated toggles + checkboxes','Keyboard-operable button controls expose checked state using aria-checked.',row(`<button type="button" class="native-toggle" role="switch" aria-checked="true" aria-label="Enable reminders" data-toggle></button><span style="font-size:11px;font-weight:1000">REMINDERS</span><button type="button" class="native-check" role="checkbox" aria-checked="true" aria-label="Include publishing events" data-check></button><span style="font-size:11px;font-weight:1000">PUBLISHING</span><button type="button" class="native-check" role="checkbox" aria-checked="false" aria-label="Include development tasks" data-check></button><span style="font-size:11px;font-weight:1000">TASKS</span>`)+`<div class="primitive-note">Production implementation must use the existing animated checkbox/toggle primitives and their canonical focus, size, and palette contracts.</div>`)}
 ${section('Top split module + publishing card','Compositions for project tools and publishing workflows. Header rail and footer actions remain consistent.',`<div class="publishing-card"><div class="publish-head"><button class="native-square" style="width:27px;height:27px" aria-label="Publishing module">▣</button><b style="font-size:12px">PUBLISHING PLAN</b><span style="margin-left:auto" class="native-pill">TOP MODULE</span></div><div class="publish-body"><div class="publish-thumb" aria-label="16:9 thumbnail preview">▶</div><div class="publish-info"><b style="font-size:12px">Calendar System Launch</b><p style="font-size:10px;line-height:1.5;margin:5px 0">Thumbnail, publishing state, event date and project relation.</p><div class="native-row" style="margin:0"><span class="spectrum" style="--tag:#f55efc"><i></i>Scheduled</span><span class="spectrum" style="--tag:#ffda47"><i></i>Milestone</span></div></div></div><div class="publish-foot">${btn('Open project','neutral')}${btn('Review','success')}</div></div>`)}
 ${section('Calendar states + view selector','Date selection and Month / Week / Agenda navigation should share one calendar model.',row(`<button type="button" class="native-btn"><span class="rail-icon">‹</span><span class="rail-text">Previous</span></button><button type="button" class="native-btn"><span class="rail-icon">⌂</span><span class="rail-text">Today</span></button><button type="button" class="native-btn"><span class="rail-icon">›</span><span class="rail-text">Next</span></button>`)+row(`<div class="seg" role="group" aria-label="Calendar view" style="display:flex"><button type="button" class="on" data-view>Month</button><button type="button" data-view>Week</button><button type="button" data-view>Agenda</button></div>`)+`<div class="primitive-note">Date math, event persistence, authorization and workflow status remain domain/application responsibilities, not primitive responsibilities.</div>`)}
 </div><p style="font-size:10px;opacity:.65;margin:14px 0 0">Implementation boundary: this standalone file demonstrates the requested component family and interaction intent. Production migration must use actual exports from src/studio-ui and canonical token emitters after the repository audit.</p></div>`;
 lib.insertAdjacentHTML('beforeend',content);
 document.addEventListener('click',e=>{const t=e.target.closest('[data-toggle],[data-check]');if(t){const next=t.getAttribute('aria-checked')!=='true';t.setAttribute('aria-checked',String(next));return}const rem=e.target.closest('[data-remove-tag]');if(rem){rem.closest('.close-tag')?.remove();return}const v=e.target.closest('[data-view]');if(v){v.parentElement.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b===v));}});
})();
</script>

</body></html>
