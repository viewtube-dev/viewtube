 'Primary Button':'vt-button','Secondary Button':'vt-button','Neutral Button':'vt-button','Destructive Button':'vt-button','Square Icon Button':'vt-button','Split Left Button':'vt-button','Head Tail Action':'vt-button','Split Menu':'vt-popover','Dropdown':'vt-select','Top Title Dropdown':'vt-select','Select Menu':'vt-select','Context Menu':'vt-popover','Text Input':'vt-input','Textarea':'vt-textarea','Split Search':'vt-input','Number Field':'vt-number','Input Action':'vt-input','Stepper':'vt-number','Slider':'vt-slider','Range Slider':'vt-range','Toggle':'vt-toggle','Settings Switch':'vt-toggle','Checkbox':'vt-checkbox','Radio':'vt-radio','Segmented Choice':'vt-segmented','Button Group':'vt-button-group','Tag':'vt-tag','Removable Tag':'vt-tag','Selectable Tag':'vt-tag','Tag Editor':'vt-tag','Badge':'vt-badge','Status Badge':'vt-badge','Progress Bar':'vt-progress','Progress Value':'vt-progress','KPI':'vt-metric','Stat Card':'vt-card','Tooltip':'vt-tooltip','Knob Dial':'vt-knob','Field Label':'vt-component','Surface':'vt-card','State Panel':'vt-alert','Output Card':'vt-card','Metric':'vt-metric','Link Button':'vt-button','Data Table':'vt-table','Color Picker':'vt-color','Media Card':'vt-card','Selectable List Row':'vt-card','Reorderable Row':'vt-card','Tabs':'vt-tabs','Alert':'vt-alert','Step Indicator':'vt-step','Dialog':'vt-dialog-2','Drawer':'vt-drawer','Calendar':'vt-calendar','Loader':'vt-progress','Skeleton':'vt-skeleton','Toast':'vt-toast','Popover':'vt-popover','Disclosure':'vt-disclosure','Divider':'vt-component','Pagination':'vt-pagination','Controller Switch':'vt-toggle','LED Light':'vt-led','Icon Rail Control':'vt-button','Hover Card':'vt-card','Meter':'vt-meter','Avatar':'vt-avatar','Name Value List':'vt-name-value','Breadcrumb':'vt-breadcrumb','Carousel':'vt-carousel','Command Palette':'vt-command','Metric Strip':'vt-metric','Horizontal Scrollbar':'vt-slider','Vertical Scrollbar':'vt-slider','Data Stats Module':'vt-metric','Upload Frame':'vt-upload','Tree View':'vt-tree','Disabled Button':'vt-button','Disabled Split Button':'vt-button','Two Color Data Stats':'vt-metric','Monochrome Data Stats':'vt-metric','Tiny Data Stats':'vt-metric','Tooltip Dark':'vt-tooltip','Tooltip Color':'vt-tooltip','Dashboard Pill Tags':'vt-tag','Aspect Ratio Frame':'vt-aspect','Toolbar':'vt-toolbar','Mini SubToolbox':'vt-toolbar','Full-Width Section Band':'vt-toolbar','Text + Badge Data Grid':'vt-table','Interactive Checklist Progress':'vt-step','Production Planner Grid':'vt-table'};
function familyApi(f){return VT_FAMILY_API[f]||'vt-component'}
function mountApp(){const app=document.getElementById('app');app.innerHTML=`<header class="topbar"><div class="brand">VIEWTUBE / COMPONENT LIBRARY</div><div class="grow"></div><button class="vt-control size-l2" id="themeBtn">DARK</button><button class="vt-control size-l2" id="qaBtn">QA</button></header><div class="layout"><aside class="sidebar"><div class="fieldrow"><input class="vt-field size-l2" id="familySearch" placeholder="SEARCH 136 FAMILIES…"></div><div class="catalog-nav" id="nav" style="margin-top:12px"></div></aside><main class="content"><section class="hero"><div class="muted">STANDALONE • OFFLINE • WEB COMPONENTS</div><h1>ViewTube UI System</h1><p>Reusable primitives, compounds, modules and toolbox shells using one shared runtime. Source families remain searchable and traceable.</p></section><section class="panel"><h2>System</h2><div class="kpis"><div class="kpi"><strong>136</strong><span>source families</span></div><div class="kpi"><strong>40+</strong><span>functional element types</span></div><div class="kpi"><strong>L0/L1/L2</strong><span>system scale</span></div><div class="kpi"><strong>2</strong><span>themes</span></div></div></section><section class="panel"><h2>Catalog</h2><p class="muted">Catalog rendering is paginated to keep the standalone file responsive. Use search or page controls to inspect the complete source inventory.</p><div class="catalog-tools"><span id="catalogCount" class="muted"></span><div><button class="vt-control size-l2" id="prevPage">PREV</button> <button class="vt-control size-l2" id="nextPage">NEXT</button></div></div><div class="grid" id="grid"></div></section><section class="panel" id="qa"><h2>Built-in QA</h2><div id="qaOut"></div></section></main></div>`;const nav=document.getElementById('nav'),grid=document.getElementById('grid'),search=document.getElementById('familySearch'),count=document.getElementById('catalogCount');let page=0;const pageSize=24;let current=[];function apiMarkup(name){const tag=familyApi(name);return `<details class="api"><summary>API / CODE</summary><code class="code">&lt;${tag} size="L1"&gt;&lt;/${tag}&gt;</code><button class="vt-control size-l2 copy-api" data-code="&lt;${tag} size=&quot;L1&quot;&gt;&lt;/${tag}&gt;">COPY</button></details>`}function render(filter=''){current=VT_COMPONENTS.filter(x=>x.name.toLowerCase().includes(filter.toLowerCase()));const pages=Math.max(1,Math.ceil(current.length/pageSize));page=Math.min(page,pages-1);const slice=current.slice(page*pageSize,(page+1)*pageSize);count.textContent=`${current.length} families · PAGE ${page+1}/${pages}`;document.getElementById('prevPage').disabled=page===0;document.getElementById('nextPage').disabled=page===pages-1;nav.innerHTML=slice.map((x,i)=>`<button class="vt-control size-l2" data-family="${encodeURIComponent(x.name)}" aria-current="${i===0?'true':'false'}">${x.name}</button>`).join('');grid.innerHTML=slice.map(x=>`<article class="family-card" id="family-${encodeURIComponent(x.name)}"><h3>${x.name}</h3><small>${x.migration} · ${x.preview} · ${x.portrait}</small><div class="preview">${upgradePreview(x.name)}</div><div class="muted">L0 · L1 · L2 · reusable runtime</div>${apiMarkup(x.name)}</article>`).join('');nav.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{document.getElementById('family-'+b.dataset.family)?.scrollIntoView({behavior:'smooth',block:'start'});nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-current','false'));b.setAttribute('aria-current','true')});grid.querySelectorAll('.copy-api').forEach(b=>b.onclick=async()=>{const value=b.dataset.code.replaceAll('&lt;','<').replaceAll('&gt;','>').replaceAll('&quot;','"');try{await navigator.clipboard.writeText(value);b.textContent='COPIED'}catch{b.textContent='COPY MANUALLY'}setTimeout(()=>b.textContent='COPY',900)})}render();search.oninput=e=>{page=0;render(e.target.value)};document.getElementById('prevPage').onclick=()=>{page--;render(search.value)};document.getElementById('nextPage').onclick=()=>{page++;render(search.value)};document.getElementById('themeBtn').onclick=()=>{VT.theme(document.documentElement.dataset.vtTheme==='dark'?'default':'dark');document.getElementById('themeBtn').textContent=document.documentElement.dataset.vtTheme==='dark'?'LIGHT':'DARK'};document.getElementById('qaBtn').onclick=()=>document.getElementById('qa').scrollIntoView({behavior:'smooth'});VT.upgradeDeclarative(document);runQA2()}
function runQA2(){const tests=[];const add=(n,p,d)=>tests.push({n,p,d});add('136 source families registered',VT_COMPONENTS.length===136,VT_COMPONENTS.length);add('Core + compound elements registered',!!customElements.get('vt-button')&&!!customElements.get('vt-select')&&!!customElements.get('vt-table'), 'button/select/table');add('L0/L1/L2 scale',getComputedStyle(document.documentElement).getPropertyValue('--vt-l0').trim()==='56px','56/48/32');const samples=['vt-select','vt-range','vt-calendar','vt-table','vt-media-controls','vt-upload','vt-command'];for(const tag of samples){const e=document.createElement(tag);document.body.append(e);add(`${tag} mounts`,!!e.firstElementChild,'custom element');e.remove()}const out=document.getElementById('qaOut');out.innerHTML=tests.map(t=>`<div><strong class="${t.p?'qa-pass':'qa-fail'}">${t.p?'PASS':'FAIL'}</strong> ${t.n} <span class="muted">— ${t.d}</span></div>`).join('')}
runQA=runQA2;


if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mountApp);else mountApp();
