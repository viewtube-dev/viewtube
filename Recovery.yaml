schema_version: "1.0"
updated: "2026-10-04"
project: "ViewTube"
repository: "viewtube-dev/viewtube"
branch: "main"

canonical:
  human_document: "Recovery.md"
  structured_state: "Recovery.yaml"
  compatibility_pointer: "Recovery"
  source_protocol: "docs/recovery/VIEWTUBE_MULTI_CONVERSATION_RECOVERY_PROTOCOL_2026-10-02.md"
  source_ledger: "docs/recovery/VIEWTUBE_MULTI_CONVERSATION_RECOVERY_LEDGER_2026-10-02.md"
  artifact_index: "docs/recovery/VIEWTUBE_CONVERSATION_RECOVERY_INDEX_2026-10-02.md"

agent_contract:
  read_before_work:
    - "Recovery.md"
    - "Recovery.yaml"
  write_durable_artifacts: true
  update_work_log: true
  preserve_provenance: true
  append_round_1: true
  reconcile_round_2: true
  stale_write_protection: true
  require_current_blob_sha_before_update: true

status_vocabulary:
  - VERIFIED
  - REPORTED
  - INFERRED
  - PROPOSED
  - IMPLEMENTED
  - VERIFIED IMPLEMENTATION
  - FAILED
  - BLOCKED
  - SUPERSEDED
  - UNKNOWN

event_classes:
  - DISCOVERY
  - DOCUMENT
  - ARCHITECTURE
  - IMPLEMENTATION
  - FIX
  - TEST
  - BUILD
  - DEPLOYMENT
  - DECISION
  - APPROVAL
  - FAILURE
  - REGRESSION
  - BLOCKER
  - CONFLICT
  - RECONCILIATION
  - HANDOFF
  - UNKNOWN

artifact_roots:
  canonical_project: "Use existing project path when known"
  recovery_only: "docs/recovery"
  handoffs: "docs/recovery/handoffs"
  architecture: "docs/recovery/architecture"
  plans: "docs/recovery/plans"
  audits: "docs/recovery/audits"
  implementation: "docs/recovery/implementation"
  governance: "docs/recovery/governance"
  design: "docs/recovery/design"
  deployment: "docs/recovery/deployment"
  data: "docs/recovery/data"
  youtube: "docs/recovery/youtube"
  technical: "docs/recovery/technical"

rounds:
  round_1:
    purpose: "Independent conversation recovery"
    reconciliation: false
    preserve_conflicts: true
  round_2:
    purpose: "Cross-conversation reconciliation"
    reconciliation: true
    establish_authoritative_versions: true

completion_rule:
  plans_are_completion: false
  audits_are_completion: false
  tracked_task_completion_requires:
    - "implementation completed"
    - "merged to main"
    - "verified"

provenance_chain:
  - SOURCE
  - DISCOVERY
  - DECISION
  - IMPLEMENTATION
  - VERIFICATION

priority_for_conflict_resolution:
  - "current verified implementation"
  - "verified tests/deployments"
  - "current canonical docs"
  - "explicit approved decisions"
  - "recovery artifacts"
  - "conversation plans"
  - "general discussion"

work_log:
  format: "REC-YYYYMMDD-<agent>-<sequence>"
  append_only_round_1: true
  required_fields:
    - LOG-ID
    - timestamp
    - agent
    - round
    - category
    - action
    - source
    - evidence
    - status
    - artifact
    - external_identifier
    - dependencies
    - result
    - next_action
    - verification

initial_events:
  - id: "REC-20261004-system-001"
    status: "VERIFIED IMPLEMENTATION"
    category: "GOVERNANCE / RECOVERY"
    action: "Converted recovery to Markdown master plus structured YAML state."
    artifacts:
      - "Recovery.md"
      - "Recovery.yaml"
    date: "2026-10-04"

current_state:
  repository_recoverability: "UNKNOWN"
  code_recoverability: "UNKNOWN"
  documentation_recoverability: "VERIFIED"
  architecture_recoverability: "RECOVERED / REQUIRES RECONCILIATION"
  deployment_recoverability: "UNKNOWN"
  data_schema_recoverability: "UNKNOWN"
  youtube_creator_recoverability: "UNKNOWN"
  remaining_gaps: []
  reconciliation_round: "PENDING"

known_repository_facts:
  repository: "viewtube-dev/viewtube"
  default_branch: "main"
  recovery_directory: "Recovery"
  note: "Current GitHub repository state is authoritative for file existence; historical conversation claims require verification."

agent_handoff_minimum:
  - "what_was_found"
  - "where_it_came_from"
  - "what_it_means"
  - "what_is_verified"
  - "what_is_not"
  - "what_must_happen_next"


conversation_recovery_artifacts:
  - id: "REC-20261004-vault-recovery-001"
    round: 1
    status: "IMPLEMENTED"
    title: "Vault + Projects Conversation Recovery Handoff"
    path: "docs/recovery/handoffs/VIEWTUBE_VAULT_PROJECTS_CONVERSATION_RECOVERY_2026-10-04.md"
    source: "Current ChatGPT conversation"
    provenance: "SOURCE → DISCOVERY → RECOVERY ARTIFACT"
    verification: "Canonical Recovery files and Vault/Asset Workbench master inspected; external implementation claims remain unverified."
    commit: "c0e4696167ea1ca459a69812402736d8c3158411"
    unresolved:
      - "Reconcile cbrewsterthegreat/ViewTube historical implementation claims against viewtube-dev/viewtube/main."
      - "Determine current runtime ownership for Vault assets and Projects."
      - "Determine canonical SubToolbox implementation and available primitives."

  - id: "REC-20261004-quickwins-001"
    round: 1
    status: "VERIFIED"
    title: "Quick Wins Conversation Recovery Handoff"
    path: "docs/recovery/handoffs/VIEWTUBE_QUICK_WINS_CONVERSATION_RECOVERY_2026-10-04.md"
    source: "Current ChatGPT conversation"
    provenance: "SOURCE → DISCOVERY → RECOVERY ARTIFACT"
    verification: "Canonical Recovery system and Quick Wins 100 resource references inspected; historical implementation claims remain unverified against canonical main."
    commit: "2de62da15c8b261c1d2ed4f0fc3210bb7695f3a3"
    unresolved:
      - "Recover the authoritative Quick Wins 100 source before recreating the tracker."
      - "Reconcile historical cbrewsterthegreat/ViewTube quick-win claims against viewtube-dev/viewtube/main."
      - "Establish the canonical implementation count only from merged and verified main state."


# Full-conversation document preservation policy
conversation_document_preservation:
  review_entire_conversation: true
  preserve_major_plans: true
  preserve_major_audits: true
  preserve_substantive_assistant_responses: true
  response_can_be_document_equivalent: true
  summary_is_not_substitute_for_artifact: true
  one_line_log_is_not_sufficient_for_major_artifact: true
  update_existing_canonical_document_when_available: true
  consolidate_related_documents_when_appropriate: true
  create_new_document_when_no_canonical_target_exists: true
  preserve_conversation_specific_material_as_recovery_artifact: true
  preserve_conflicting_versions_for_round_2: true
  required_final_report:
    - documents_created
    - documents_updated
    - material_not_preserved_and_reason
    - verification_status
    - unresolved_items
  activation_prompt: "docs/recovery/VIEWTUBE_CONVERSATION_AGENT_ACTIVATION_PROMPT.md"


agent_update_report:
  required: true
  timezone: America/New_York
  exact_timestamp: true
  distinguish_est_from_edt: true
  required_fields:
    - update_id
    - exact_eastern_timestamp
    - conversation_title
    - main_focus
    - files_added
    - files_edited
    - commit_shas
    - discoveries
    - code_discoveries
    - optimizations
    - recommended_improvements
    - verification
    - blockers
    - next_actions
  inventory_all_repository_file_changes: true
  discoveries_are_first_class_artifacts: true
  optimizations_are_first_class_artifacts: true
  preserve_in_recovery_md: true
  preserve_in_structured_state_when_appropriate: true


engineering_product_intelligence:
  mandatory: true
  finding_classes:
    - bugs
    - code_structure_issues
    - tool_improvements
    - new_tools
    - workflow_improvements
    - handoff_improvements
    - ai_improvements
    - ux_product_improvements
    - performance_scalability
    - security_reliability
    - data_model_improvements
    - testing_verification_improvements
  implementation_not_required_to_record: true
  required_finding_fields:
    - finding_id
    - category
    - title
    - affected_area
    - discovery
    - source
    - evidence
    - status
    - impact
    - recommended_improvement
    - proposed_implementation
    - dependencies
    - related_documents
    - verification_needed
  preserve_as_first_class_project_intelligence: true

  - id: "REC-20261004-document-inventory-001"
    round: 1
    status: "VERIFIED"
    title: "Documentation / Brain / Account Artifact Inventory"
    path: "docs/recovery/handoffs/VIEWTUBE_DOCUMENT_ARTIFACT_INVENTORY_2026-10-04.md"
    source: "Current ChatGPT conversation"
    provenance: "SOURCE → DISCOVERY → RECOVERY ARTIFACT"
    verification: "Recovery system, playbook, index, catalog, and relevant Brain/Account/Project/Vault resources inspected on canonical main."
    commit: "d7c813b519951330953068a3a963ea9701411a03"
    discoveries:
