knowledge_system:
  canonical_index: "docs/recovery/KNOWLEDGE_INDEX.md"
  operating_system: "docs/recovery/VIEWTUBE_KNOWLEDGE_OPERATING_SYSTEM.md"
  findings_register: "docs/recovery/FINDINGS_REGISTER.md"
  lifecycle:
    - SOURCE
    - FINDING
    - KNOWLEDGE
    - DECISION
    - PLAN
    - IMPLEMENTATION
    - VERIFICATION
    - HANDOFF_REUSE
  document_selection:
    existing_canonical: "update"
    related_documents: "consolidate_when_appropriate"
    no_canonical_owner: "create"
    conversation_specific_evidence: "handoff_recovery_artifact"
    superseded_material: "preserve_as_history"
  goal: "Maximum reusable project intelligence with minimum duplication and ambiguity."

document_system:
  canonical_standard: "docs/Document-System.md"
  operation_history: "docs/recovery/History.md"
  lifecycle:
    - IDEA
    - DRAFT
    - ACTIVE
    - UPDATED
    - CONSOLIDATED
    - SUPERSEDED
    - ARCHIVED
  operation_ids: "DOC-YYYYMMDD-NNN"
  required_receipt_fields:
    - update_id
    - timestamp
    - conversation
    - agent
    - application
    - action
    - source
    - destination
    - files
    - commits
    - summary
    - important_information
    - discoveries
    - conflicts
    - verification
    - blockers
    - follow_up
  concurrency_rule: "Fetch latest blob SHA before update; re-fetch shared History.md before append."
  completion_gate: "CHANGE -> PRESERVATION CHECK -> WRITE -> VERIFY -> HISTORY RECEIPT -> RECOVERY REGISTRATION -> HANDOFF"


document_health:
  canonical_standard: "docs/Document-Health.md"
  migration_plan: "docs/Organization.md"
  pre_migration_snapshot_branch: "recovery/pre-document-system-migration-2026-10-04"
  states:
    - HEALTHY
    - ATTENTION
    - WARNING
    - CONFLICT
    - BLOCKED
    - UNKNOWN
    - VERIFIED
  workflow: "SCAN -> CLASSIFY -> COLLECT EVIDENCE -> RECOMMEND -> REVIEW -> CHANGE -> VERIFY -> LOG"
  destructive_cleanup_gate: "INVENTORY -> PRESERVATION -> RECONCILIATION -> LINK CHECK -> VERIFICATION -> HISTORY RECEIPT -> CLEANUP"
  destructive_automation: false


sync_activation:
  canonical_prompt: "docs/recovery/Sync.md"
  activation_phrase: "VIEWTUBE SYNC"
  canonical_branch: "main"
  behavior: "Read Sync.md and execute the full ViewTube documentation/recovery synchronization protocol."


