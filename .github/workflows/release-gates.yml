name: ViewTube release gates

on:
  pull_request:
    branches:
      - main
      - master/consolidated-feature-integration
  push:
    branches:
      - main
      - integration/**
      - codex/**
      - master/consolidated-feature-integration

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source_governance:
    name: source-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:studio-component-grid-css
      - run: npm run audit:confirmed-catalog
      - run: npm run check:src-governance
      - run: npm run test:confirmed-library-layout
      - run: node --test scripts/audit/studio-control-motion.test.mjs
      - run: node --test scripts/audit/release-gates-dependencies.test.mjs
      - run: git diff --check
      - run: npm run check:routes
      - run: npm run check:css
      - run: npm run check:quarantine
      - run: npm run check:privacy-src
      - run: npm run test:ai-systems-governance
      - run: npm run test:ai-systems-herald
      - run: npm run test:brain-runtime-snapshot
      - run: npm run audit:ai-systems
      - run: npm run test:convergence-governance


  conversation_handoff_contract:
    name: conversation-handoff-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:conversation-handoff-contract
      - run: npm run test:document-system
      - run: npm run audit:documents


  focused_contracts:
    name: focused-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:public-page-resolver
      - run: npm run test:vault-operation-store
      - name: Verify Studio counter and dropdown regression contracts
        run: |
          npm run studio:tokens
          git diff --exit-code -- src/styles/studio-control-vars.generated.css
          node --test scripts/audit/studio-counter-dropdown-regression.test.mjs
      - run: npm run test:studio-controls
      - run: npm run test:focused
      - run: npm run test:unified-diagnostics
      - run: npm run account:test

  gemini_governance:
    name: gemini-governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:ai-generation-callers
      - name: Generate exact-commit Gemini caller inventory
        run: npm run audit:ai-generation-callers > "$RUNNER_TEMP/ai-generation-callers.json"
      - run: npx vitest run src/context/geminiKeyValidation.test.ts src/context/GeminiKeyContext.test.ts src/context/GeminiKeyContext.runtime.test.tsx src/services/__tests__/geminiModelGovernance.test.ts src/services/__tests__/geminiCustomKeyAccess.test.ts src/services/CollabEngine.test.ts src/services/brain/CoreGateway.contract.test.ts src/services/brain/__tests__/BrainModelGatewayBoundary.test.ts src/services/brain/__tests__/assetModelRunner.test.ts src/services/brain/assetStrategies/commentReply.test.ts src/services/brain/assetStrategies/videoPublisherSeo.test.ts src/services/brain/assetStrategies/tagSuggestions.test.ts src/services/brain/assetStrategies/educationalTimestamps.test.ts src/services/brain/commentEngagement.test.ts src/services/__tests__/scriptGenerationGateway.test.ts src/services/brain/__tests__/pinnedCommentDraft.test.ts src/services/asset-engine/GenerationWorkflow.test.ts src/services/operations/OperationRecord.test.ts src/services/brain/__tests__/brainProviderArchitectureGuard.test.ts src/services/channelPlanningIntelligence.test.ts src/services/projectPlanningIntelligence.test.ts
      - name: Upload Gemini caller inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-caller-inventory-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ai-generation-callers.json
          if-no-files-found: error

  full_suite:
    name: full-suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  static_quality:
    name: static-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:runtime

  production_build:
    name: production-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set build identity
        run: |
          echo "VT_BUILD_BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "VT_BUILD_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          echo "VT_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm run build

  local_smoke:
    name: local-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start ViewTube and run smoke checks
        run: |
          npm run dev > "$RUNNER_TEMP/viewtube-dev.log" 2>&1 &
          DEV_PID=$!
          trap 'kill "$DEV_PID" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:5173/api/release >/dev/null; then
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/viewtube-dev.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:5173/api/release >/dev/null || {
            cat "$RUNNER_TEMP/viewtube-dev.log"
            exit 1
          }
          npm run smoke:local

  brain_quality_loop:
    name: brain-quality-loop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:brain-quality-loop-contract
      - run: npm run test:brain-quality-loop
