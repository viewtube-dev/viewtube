name: Studio Controls regression
on:
  pull_request:
    branches: [master/consolidated-feature-integration]
    paths:
      - '.github/workflows/studio-controls-regression.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/audit/confirmed-library-layout.test.mjs'
      - 'scripts/audit/studio-*.test.mjs'
      - 'src/studio-ui/**'
      - 'src/styles/studio-control-*.css'
      - 'src/styles/studio-dropdown-geometry.css'
      - 'src/styles/studio-split-accordion.css'
      - 'src/components/studio-hub/StudioHubConfirmedPrimitiveCatalog*'
      - 'src/components/studio-hub/studio-hub-primitive-catalogs.css'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-controls-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  studio-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Studio primitive and catalog tests
        run: npm run test:studio-controls
      - name: Confirmed library layout audit
        run: npm run test:confirmed-library-layout
      - name: Studio control contracts
        run: |
          node --test \
            scripts/audit/studio-restored-primitives.test.mjs \
            scripts/audit/studio-counter-primitives.test.mjs \
            scripts/audit/studio-dropdown-counter-slider-contract.test.mjs \
            scripts/audit/studio-field-style-ownership.test.mjs
      - name: CSS contract checks
        run: npm run check:css
      - name: Production build
        run: npm run build
      - name: Diff hygiene
        run: git diff --check
