name: One-time Studio field border migration
on:
  push:
    branches: [master/consolidated-feature-integration]
    paths: [.github/workflows/studio-field-border-migration.yml, scripts/migrations/studio-field-border.mjs]
permissions:
  contents: write
concurrency:
  group: studio-field-border-migration
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply guarded migration in checkout
        run: |
          set -euo pipefail
          mkdir -p migration-results
          node scripts/migrations/studio-field-border.mjs 2>&1 | tee migration-results/migration.log
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee migration-results/typecheck.log
      - name: Shared field tests
        run: npx vitest run src/studio-ui/primitives/StudioFieldSurface.test.tsx src/studio-ui/primitives/StudioSplitTextInputStyleContract.test.ts 2>&1 | tee migration-results/fields.log
      - name: Existing Studio regression gates
        run: |
          set -euo pipefail
          npm run test:studio-controls 2>&1 | tee migration-results/studio.log
          npm run test:studio-field-style-ownership 2>&1 | tee migration-results/ownership.log
          npm run test:studio-floating-input-typography 2>&1 | tee migration-results/typography.log
          npm run check:css 2>&1 | tee migration-results/css.log
      - name: Production build
        run: npm run build 2>&1 | tee migration-results/build.log
      - name: Commit only validated source changes
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/studio-ui/primitives/StudioFieldSurface.tsx src/studio-ui/primitives/StudioFieldSurface.test.tsx src/studio-ui/primitives/StudioTextInput.tsx src/studio-ui/primitives/StudioTextArea.tsx src/studio-ui/primitives/StudioControls.tsx src/studio-ui/primitives/StudioSplitTextInput.tsx src/studio-ui/primitives/studio-split-text-input.css src/studio-ui/primitives/StudioSplitTextInputStyleContract.test.ts src/studio-ui/index.ts src/styles/studio-field-surface.css src/styles/studio-control-entry.css src/styles/studio-text-input.css
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): adopt shared real field borders'
          git push origin HEAD:refs/heads/master/consolidated-feature-integration
          echo "Validated source commit: $(git rev-parse HEAD). Browser geometry verification is still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostic patch and logs
        if: always()
        run: |
          mkdir -p migration-results
          git diff -- src/studio-ui src/styles > migration-results/remaining.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-field-migration-results-${{ github.run_id }}
          path: migration-results/
          retention-days: 7
